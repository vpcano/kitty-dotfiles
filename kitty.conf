# ==============================================================================
# Kitty Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# Theme: Catppuccin Mocha
# ------------------------------------------------------------------------------
include themes/mocha.conf

# ------------------------------------------------------------------------------
# Window and macOS Titlebar
# ------------------------------------------------------------------------------
# Minimal native macOS titlebar: hide native bar title while preserving controls/corners
hide_window_decorations titlebar-only
macos_titlebar_color background
macos_show_window_title_in none

# Window padding: top only, to avoid clipping near rounded macOS corners.
# Zeroed elsewhere so the tmux status bar sits flush; pane breathing room is handled in tmux.
window_padding_width 8 0 0 0
# anchor the cell grid to the bottom: sub-cell remainder goes to the top (invisible), no gap under the tmux bar
# airier rows (also makes the tmux status bar taller)
modify_font cell_height 125%
placement_strategy bottom

# ------------------------------------------------------------------------------
# Font: Fira Code with Ligatures and Stylistic Sets
# As recommended in catppuccin/kitty README FAQ
# ------------------------------------------------------------------------------
font_family      Fira Code
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

disable_ligatures never

# Stylistic sets and alternates from Catppuccin repo:
# +cv02 +cv05 +cv09 +cv14 +ss04 +cv16 +cv31 +cv25 +cv26 +cv32 +cv28 +ss10 +zero +onum
font_features FiraCode-Regular  +cv02 +cv05 +cv09 +cv14 +ss04 +cv16 +cv31 +cv25 +cv26 +cv32 +cv28 +ss10 +zero +onum
font_features FiraCode-Bold     +cv02 +cv05 +cv09 +cv14 +ss04 +cv16 +cv31 +cv25 +cv26 +cv32 +cv28 +ss10 +zero +onum
font_features FiraCode-Retina   +cv02 +cv05 +cv09 +cv14 +ss04 +cv16 +cv31 +cv25 +cv26 +cv32 +cv28 +ss10 +zero +onum
font_features FiraCode-Medium   +cv02 +cv05 +cv09 +cv14 +ss04 +cv16 +cv31 +cv25 +cv26 +cv32 +cv28 +ss10 +zero +onum
font_features FiraCode-SemiBold +cv02 +cv05 +cv09 +cv14 +ss04 +cv16 +cv31 +cv25 +cv26 +cv32 +cv28 +ss10 +zero +onum
font_features FiraCode-Light    +cv02 +cv05 +cv09 +cv14 +ss04 +cv16 +cv31 +cv25 +cv26 +cv32 +cv28 +ss10 +zero +onum

# ------------------------------------------------------------------------------
# Tab Management and Tab Bar Disabled
# ------------------------------------------------------------------------------
tab_bar_style hidden
tab_bar_min_tabs 2

# Disable tab management shortcuts
map cmd+t        no_op
map ctrl+shift+t no_op
map cmd+w        close_window
map ctrl+shift+q no_op
map ctrl+shift+w close_window
map ctrl+shift+right no_op
map ctrl+shift+left  no_op
map ctrl+shift+.     no_op
map ctrl+shift+,     no_op
map ctrl+shift+alt+t no_op
# C-S-h/l -> xterm S-F1/S-F2 sequences, bound in tmux for window switching
map ctrl+shift+h    send_text all \x1b[1;2P
map ctrl+shift+l    send_text all \x1b[1;2Q

# left Option acts as Alt/Meta (needed for <A-*> resize maps in nvim);
# right Option still types special characters
macos_option_as_alt left

shell tmux new-session
